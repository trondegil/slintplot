[workspace]
resolver = "3"
members = ["crates/slintplot", "examples/gallery", "examples/stress", "examples/docshots"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/trondegil/slintplot"
license = "GPL-3.0-only OR PolyForm-Noncommercial-1.0.0 OR LicenseRef-SlintPlot-Commercial"

[workspace.dependencies]
slint = "1.18"
slint-build = "1.18"
slintplot = { path = "crates/slintplot", version = "0.2" }

# The browser gallery: smaller download at the cost of a slower build.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
