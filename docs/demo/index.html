<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlintPlot Gallery: Slint charts in the browser</title>
<meta name="description" content="Every SlintPlot chart type, running in the browser with WebAssembly.">
<link rel="canonical" href="https://slintplot.dev/demo/">
<link rel="icon" href="../assets/slintplot-icon.png">
<!-- Fetched in parallel with the page instead of one after the other.
     The website workflow replaces BUILD with a hash of the build, so that
     browsers fetch each new build instead of a cached old one. -->
<link rel="modulepreload" href="gallery.js?v=BUILD">
<link rel="preload" href="gallery_bg.wasm?v=BUILD" as="fetch" type="application/wasm" crossorigin>
<!-- Privacy-friendly analytics by Plausible: visit counts without cookies or
     personal data, plus the site's custom events. Outbound link clicks are
     switched on in Plausible's site settings. -->
<script async src="https://plausible.io/js/pa-Uc9vcGHjcu2slhm1AwQAS.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
  /* The gallery's own colors (Look in examples/gallery/ui/gallery.slint).
     The gallery fills the page; its sample list has the site's links. */
  :root { --page: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #161618; --text: #f5f5f7; --muted: #a1a1a6; }
  }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  main { position: relative; flex: 1; min-height: 0; }
  /* Slint sizes the canvas to the app's preferred size; keep it filling the page. */
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 16px; }
</style>
</head>
<body>
<main>
  <canvas id="canvas" tabindex="0" role="application" aria-label="SlintPlot gallery: interactive charts" aria-describedby="about">
    <p id="about">The SlintPlot gallery, drawn with Slint on this canvas: every chart type, with live data,
    themes and dark mode. Screen readers can't read its contents yet; the
    <a href="../">documentation</a> describes every chart in text.</p>
  </canvas>
  <div id="status" role="status">Loading the gallery…</div>
</main>
<script type="module">
  import init from "./gallery.js?v=BUILD";
  const status = document.getElementById("status");
  // Slint draws with WebGL, and can't start without it.
  if (!document.createElement("canvas").getContext("webgl")) {
    status.textContent = "The gallery needs WebGL, which this browser has turned off.";
  } else {
    try {
      await init({ module_or_path: "gallery_bg.wasm?v=BUILD" });
      status.remove();
    } catch (error) {
      // Slint's event loop runs by throwing out of `main`; the app keeps going.
      if (String(error).includes("Using exceptions for control flow")) status.remove();
      else status.textContent = "The gallery couldn't start: " + error;
    }
  }
</script>
</body>
</html>
