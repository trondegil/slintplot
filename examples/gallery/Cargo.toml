[package]
name = "slintplot-gallery"
version = "0.2.2"
description = "Sample browser for SlintPlot: every chart type, with live data editing, themes and dark mode"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage = "https://slintplot.dev"
keywords = ["slint", "chart", "plot", "gui", "demo"]
categories = ["gui", "visualization"]
readme = "README.md"
include = ["src/**", "ui/**", "build.rs", "icon.png", "logo.png", "logo-dark.png", "README.md", "LICENSE.md", "LICENSE-GPL-3.0.txt", "LICENSE-POLYFORM-NC.md", "COMMERCIAL.md"]

[dependencies]
slintplot.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `software-renderer-path` lets the software renderer (used by `--snapshot`) draw paths;
# `unstable-winit-030` gives the window frame (see ui/window_frame.slint) its window.
slint = { workspace = true, features = ["software-renderer-path", "unstable-winit-030"] }
# Writes the `--snapshot` PNG files.
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only what the browser uses: WebGL rendering, without the software renderer,
# accessibility or the system tray.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
# Starts the gallery in the browser (see web/).
wasm-bindgen = "0.2"
# Shows Rust panics in the browser console.
console_error_panic_hook = "0.1"
# The browser's clock, for the live data sample's update rate.
js-sys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock icon (see src/dock_icon.rs).
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
slint-build.workspace = true
slintplot.workspace = true
